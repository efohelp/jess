<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>JESS Radio</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e0f12;--panel:#181b21;--panel2:#22262e;
  --text:#f5f6fa;--muted:#aeb4c0;--accent:#7697ff;--border:#343945;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
main{max-width:900px;margin:auto;padding:18px}
header{
  display:flex;align-items:end;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
h1{margin:0;font-size:1.4rem}
.sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.instructions{margin-top:9px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:rgba(24,27,33,.72);color:var(--muted);font-size:.78rem;line-height:1.42}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.card{
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  background:var(--panel);
  cursor:pointer;
  color:inherit;
  text-align:left;
  padding:0;
  min-width:0;
}
.card:active{transform:scale(.985)}
.card.playing{outline:2px solid var(--accent);outline-offset:1px}
.art{
  aspect-ratio:1.42/1;
  background:linear-gradient(135deg,#2b3040,#15171d);
  display:grid;place-items:center;overflow:hidden;
  font-size:1.7rem;font-weight:800;color:#cbd3ff;
}
.art img{
  width:100%;
  height:100%;
  object-fit:fill;
  object-position:center;
  display:block;
}
.name{
  min-height:23px;
  padding:3px 7px 4px;
  background:rgba(25,28,34,.82);
  font-weight:700;
  font-size:.76rem;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.name.title-center{text-align:center}
.name.title-hide{display:none}
.art.title-expanded{aspect-ratio:1.18/1}
.player{
  position:sticky;bottom:8px;margin-top:14px;
  background:rgba(24,27,33,.96);
  border:1px solid var(--border);
  border-radius:13px;padding:10px;
  backdrop-filter:blur(10px);
}
.now{font-weight:700;margin-bottom:7px}
.hint{font-size:.73rem;color:var(--muted);margin-top:6px}
audio{width:100%;height:38px}
@media(max-width:560px){
  main{padding:10px}
  .grid{gap:7px}
  .art{aspect-ratio:1.35/1;font-size:1.4rem}
  .name{
    min-height:20px;
    padding:2px 5px 3px;
    font-size:.68rem;
  }
}

.station-toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:2px 0 12px;
}
.station-toolbar-title{
  font-size:.84rem;
  font-weight:760;
  white-space:nowrap;
}
.station-filter-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.station-filter-btn{
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel2);
  color:var(--text);
  font:inherit;
  font-size:.72rem;
  padding:5px 9px;
  cursor:pointer;
}
.station-filter-btn.active{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent) inset;
}
@media(max-width:560px){
  .station-toolbar{gap:6px;margin-bottom:9px}
  .station-toolbar-title{font-size:.76rem}
  .station-filter-buttons{gap:4px}
  .station-filter-btn{font-size:.65rem;padding:4px 7px}
}

</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>JESS Radio</h1>
      <div id="playlistSubtitle" class="sub">Shared playlist</div>
      <div class="instructions">
        Tap a station to play. HTTPS stations play directly on this page.
        HTTP-only stations open separately so your phone can hand the stream
        to a compatible media player. If a separate player opens, use
        <strong>Back</strong> to return to this playlist.
      </div>
    </div>
  </header>

  <div class="station-toolbar">
    <div id="stationListTitle" class="station-toolbar-title">My Stations</div>
    <div id="stationFilterButtons" class="station-filter-buttons" aria-label="Station filters"></div>
  </div>

  <div id="grid" class="grid"></div>

  <div class="player">
    <div id="now" class="now">Select a station</div>
    <audio id="audio" controls playsinline></audio>
  </div>
</main>

<script>
const grid = document.getElementById("grid");
const audio = document.getElementById("audio");
const now = document.getElementById("now");
const stationListTitle = document.getElementById("stationListTitle");
const stationFilterButtons = document.getElementById("stationFilterButtons");

let activeCard = null;
let allPublishedStations = [];
let activeFilter = {kind:"all", tag:"ALL"};

function initials(name){
  return (name || "?")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function splitTags(value){
  const out=[];
  const seen=new Set();

  String(value||"").split(",").forEach(raw=>{
    const tag=raw.trim();
    if(!tag) return;

    const key=tag.toLocaleLowerCase();
    if(seen.has(key)) return;

    seen.add(key);
    out.push(tag);
  });

  return out;
}

function stationMatchesFilter(station, filter){
  if(!filter || filter.kind==="all") return true;

  const tags=splitTags(station?.[filter.kind]||"");
  const wanted=String(filter.tag||"").toLocaleLowerCase();

  return tags.some(tag=>tag.toLocaleLowerCase()===wanted);
}

function buildFilterButtons(){
  const filters=[{kind:"all",tag:"ALL",label:"ALL"}];
  const seen=new Set(["all:all"]);

  for(const station of allPublishedStations){
    for(const tag of splitTags(station.genre)){
      const key="genre:"+tag.toLocaleLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      filters.push({kind:"genre",tag,label:tag});
    }
  }

  for(const station of allPublishedStations){
    for(const tag of splitTags(station.language)){
      const key="language:"+tag.toLocaleLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      filters.push({kind:"language",tag,label:tag});
    }
  }

  stationFilterButtons.innerHTML="";

  for(const filter of filters){
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="station-filter-btn";
    btn.textContent=filter.label;

    if(
      activeFilter.kind===filter.kind &&
      String(activeFilter.tag).toLocaleLowerCase()===String(filter.tag).toLocaleLowerCase()
    ){
      btn.classList.add("active");
    }

    btn.addEventListener("click",()=>{
      activeFilter=filter;
      renderCurrentFilter();
    });

    stationFilterButtons.appendChild(btn);
  }
}

async function playStation(station, card){
  if(activeCard) activeCard.classList.remove("playing");
  activeCard = card;
  card.classList.add("playing");
  now.textContent = station.name || "Station";

  if(/^https:\/\//i.test(station.url || "")){
    audio.src = station.url;
    try{
      await audio.play();
    }catch(err){
      window.location.href = station.url;
    }
  }else{
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    window.location.href = station.url;
  }
}

function renderStations(stations){
  grid.innerHTML="";
  activeCard=null;

  if(!stations.length){
    grid.innerHTML =
      '<div style="grid-column:1/-1;color:var(--muted)">No stations in this filter.</div>';
    return;
  }

  for(const station of stations){
    if(station.share === false) continue;

    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";

    const art = document.createElement("div");
    art.className = "art";

    if(station.icon){
      const img = document.createElement("img");
      img.src = station.icon;
      img.alt = "";
      img.addEventListener("error", () => {
        art.innerHTML = "<span>" + escapeHtml(initials(station.name)) + "</span>";
      }, {once:true});
      art.appendChild(img);
    }else{
      art.innerHTML = "<span>" + escapeHtml(initials(station.name)) + "</span>";
    }

    const label = document.createElement("div");
    label.className = "name";

    const stationTitleMode =
      ["left","center","hide"].includes(station.stationTitle)
        ? station.stationTitle
        : "left";

    if(stationTitleMode === "center") label.classList.add("title-center");

    if(stationTitleMode === "hide"){
      label.classList.add("title-hide");
      art.classList.add("title-expanded");
    }

    label.textContent = station.shortTitle || station.name;

    card.append(art, label);
    card.addEventListener("click", () => playStation(station, card));
    grid.appendChild(card);
  }
}

function renderCurrentFilter(){
  if(activeFilter.kind==="all"){
    stationListTitle.textContent="My Stations";
  }else{
    stationListTitle.textContent=activeFilter.tag+" Stations";
  }

  const filtered=allPublishedStations.filter(station=>
    station.share !== false && stationMatchesFilter(station,activeFilter)
  );

  renderStations(filtered);
  buildFilterButtons();
}

async function init(){
  try{
    const response = await fetch("./playlist.json", {cache:"no-store"});
    if(!response.ok) throw new Error("Unable to load shared playlist");

    const data = await response.json();

    document.title = "JESS — " + (data.name || "Shared Playlist");

    const subtitle=document.getElementById("playlistSubtitle");
    if(subtitle) subtitle.textContent=(data.name || "Shared Playlist");

    allPublishedStations=(data.stations||[]).filter(station=>station.share!==false);

    buildFilterButtons();
    renderCurrentFilter();
  }catch(err){
    grid.innerHTML =
      '<div style="grid-column:1/-1;color:#ff9c9c">' +
      "Could not load playlist: " + escapeHtml(err.message) +
      "</div>";
  }
}

init();
</script>
</body>
</html>
